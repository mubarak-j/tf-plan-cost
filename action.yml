name: tf-plan-cost
description: Comment the estimated monthly AWS cost change of a Terraform plan on pull requests.
author: mubarak-j
branding:
  icon: dollar-sign
  color: green

inputs:
  plan:
    description: Path to the JSON plan from `terraform show -json tfplan`.
    required: true
  mode:
    description: >-
      `action` prices the plan in this job (needs AWS credentials for pricing:GetProducts).
      `app` sends the plan, with sensitive values removed, to the tf-plan-cost GitHub App, which
      posts a Check Run and the comment (needs the App installed and `id-token: write`).
    required: false
    default: action
  app-url:
    description: tf-plan-cost App server URL (app mode). Change it only if you run your own App server.
    required: false
    default: https://tf-plan-cost.mubarak.com
  region:
    description: AWS region for resources whose region is not in the plan. Defaults to AWS_REGION.
    required: false
    default: ""
  comment:
    description: Create or update a pull request comment.
    required: false
    default: "true"
  comment-id:
    description: Separate comment per Terraform root, for example `prod` or `envs/staging`.
    required: false
    default: default
  comment-on-no-change:
    description: Post a comment even when no resources change (an earlier comment is always updated).
    required: false
    default: "false"
  config:
    description: Config file with `fail_above_monthly_usd`. Optional; a missing file means no limit.
    required: false
    default: .tf-plan-cost.yml
  github-token:
    description: 'Token used to comment in action mode. Needs `pull-requests: write`.'
    required: false
    default: ${{ github.token }}

outputs:
  delta-monthly-usd:
    description: Monthly cost change in USD, e.g. 242.24 or -16.43.
    value: ${{ steps.report.outputs.delta-monthly-usd || steps.app.outputs.delta-monthly-usd }}
  total-before-monthly-usd:
    description: Monthly cost of the priced resources before the change.
    value: ${{ steps.report.outputs.total-before-monthly-usd || steps.app.outputs.total-before-monthly-usd }}
  total-after-monthly-usd:
    description: Monthly cost of the priced resources after the change.
    value: ${{ steps.report.outputs.total-after-monthly-usd || steps.app.outputs.total-after-monthly-usd }}
  exceeded:
    description: >-
      `true` if the increase is above `fail_above_monthly_usd`. In action mode the step then fails;
      in app mode the tf-plan-cost check fails instead.
    value: ${{ steps.report.outputs.exceeded || steps.app.outputs.exceeded }}
  comment-url:
    description: URL of the created or updated comment, if any.
    value: ${{ steps.report.outputs.comment-url || steps.app.outputs.comment-url }}
  check-url:
    description: URL of the Check Run (app mode).
    value: ${{ steps.app.outputs.check-url }}

runs:
  using: composite
  steps:
    # Build from the action's own source so the binary matches the ref in
    # `uses:`. Prefer the runner's Go (GOTOOLCHAIN=auto fetches the exact
    # version) so the user's PATH is untouched; install Go only if missing.
    - name: Check inputs
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_APP_URL: ${{ inputs.app-url }}
      run: |
        case "$INPUT_MODE" in
          action) ;;
          app)
            if [ -z "$INPUT_APP_URL" ]; then
              echo "::error title=tf-plan-cost::app mode needs the app-url input"
              exit 1
            fi ;;
          *)
            echo "::error title=tf-plan-cost::mode must be action or app, got '$INPUT_MODE'"
            exit 1 ;;
        esac

    - name: Check for Go
      id: go
      shell: bash
      run: |
        if command -v go >/dev/null 2>&1; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Go
      if: steps.go.outputs.found != 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Build tf-plan-cost
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GOTOOLCHAIN: auto
        GOFLAGS: -mod=readonly
      run: go build -trimpath -o "$RUNNER_TEMP/tf-plan-cost/tf-plan-cost" ./cmd/tf-plan-cost

    - name: Price the plan
      if: inputs.mode == 'action'
      shell: bash
      env:
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_REGION: ${{ inputs.region }}
      run: |
        args=(diff --format json)
        if [ -n "$INPUT_REGION" ]; then args+=(--region "$INPUT_REGION"); fi
        "$RUNNER_TEMP/tf-plan-cost/tf-plan-cost" "${args[@]}" "$INPUT_PLAN" > "$RUNNER_TEMP/tf-plan-cost/report.json"

    - name: Comment and check the limit
      if: inputs.mode == 'action'
      id: report
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_ID: ${{ inputs.comment-id }}
        INPUT_COMMENT_ON_NO_CHANGE: ${{ inputs.comment-on-no-change }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        "$RUNNER_TEMP/tf-plan-cost/tf-plan-cost" github-comment \
          --report "$RUNNER_TEMP/tf-plan-cost/report.json" \
          --comment="$INPUT_COMMENT" \
          --comment-id "$INPUT_COMMENT_ID" \
          --comment-on-no-change="$INPUT_COMMENT_ON_NO_CHANGE" \
          --config "$INPUT_CONFIG"

    - name: Send the plan to the tf-plan-cost App
      if: inputs.mode == 'app'
      id: app
      shell: bash
      env:
        INPUT_PLAN: ${{ inputs.plan }}
        INPUT_APP_URL: ${{ inputs.app-url }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_COMMENT_ID: ${{ inputs.comment-id }}
        INPUT_COMMENT_ON_NO_CHANGE: ${{ inputs.comment-on-no-change }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        args=(upload --app-url "$INPUT_APP_URL"
          --comment="$INPUT_COMMENT"
          --comment-id "$INPUT_COMMENT_ID"
          --comment-on-no-change="$INPUT_COMMENT_ON_NO_CHANGE"
          --config "$INPUT_CONFIG")
        if [ -n "$INPUT_REGION" ]; then args+=(--region "$INPUT_REGION"); fi
        "$RUNNER_TEMP/tf-plan-cost/tf-plan-cost" "${args[@]}" "$INPUT_PLAN"
